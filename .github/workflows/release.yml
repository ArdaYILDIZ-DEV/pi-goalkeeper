name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version to release, without v (for example 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate version and changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-notes.mjs "$RELEASE_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Publish the verified tag as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-notes.mjs "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          flags=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" --verify-tag --title "Goalkeeper $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
